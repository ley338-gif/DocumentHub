server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (spec §30) ------------------------------------
    # connect-src stays broad (https: covers any api.* subdomain a given
    # deployment configures at build time via VITE_API_BASE_URL) rather
    # than hardcoded, since this same image is meant to be rebuilt per
    # deployment with a different API origin. HSTS is intentionally NOT
    # set here — TLS termination happens at the operator's reverse proxy/
    # load balancer (see docs/deployment.md "HTTPS"), which is the correct
    # place to add Strict-Transport-Security once HTTPS is actually live.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://localhost:*; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are safe to cache aggressively; index.html must
    # never be cached, or a deployed update won't reach existing clients.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback (spec §13) — a direct browser load/refresh of any client
    # route (/login, /invite/:token, /app/*, /platform/*, /p/:stableId,
    # /u/:stableId, ...) must render index.html and let React Router take
    # over, never a bare nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
